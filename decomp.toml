# Project settings read by the tools of tools/psp and tools/common

title = "Invizimals"

# First one is the default version
versions = [
    "UCES01241",  # Europe (13 languages), DISC_VERSION 1.00
    "UCUS98746",  # USA, DISC_VERSION 1.02 (paused: all-assembly build only)
]

binutils_prefix = "mips-ps2-decompals-"

# PSP_GAME/SYSDIR/EBOOT.BIN decrypted by tools/extract.py (BOOT.BIN is zeroed on
# this disc): a relocatable PRX (SPEC.md)
[modules.eboot]
file = "EBOOT.PRX"
splat = "splat.eboot.yaml"
relocatable = true

# GCC 4.0.4 built from GNU sources with the Allegrex patch and tuning of the
# LBP-PSP-Decomp kit (build 4.0.4c): 12/12 on the probes at -O2 -G0; every stack
# frame of the game is 16-aligned, hence -mpreferred-stack-boundary=4
# (notes/COMPILER.md). A Linux program, run through WSL on Windows.
[compiler]
# build 4.0.4a: the kit's 4.0.4c plus the retail block copies (tools/gcc/build_404a.sh,
# notes/COMPILER.md)
name = "psp-gcc-4.0.4a"
linux = "~/lbp-gcc4/psp-gcc-4.0.4a/bin/psp-gcc"
flags = "-O2 -G0 -mpreferred-stack-boundary=4"
# the kit's Sony assembler (binutils 2.14, PSP SDK 1.3.1) refuses lwl/lwr/swl/swr,
# which the game has (copies of unaligned structures): written as .word
unaligned_words = true

# expat 2.0.0 (src/expat, upstream sources unmodified) was built with the stock PSPDEV
# GCC 4.0.2, not with the game's compiler (notes/COMPILER.md)
[compiler.dirs."src/expat"]
linux = "~/lbp-gcc4/psp-gcc-4.0.2h/bin/psp-gcc"
flags = "-O2 -G0 -DHAVE_EXPAT_CONFIG_H -nostdinc -Iinclude/libc -Iinclude/expat"

# Bullet (src/bullet, trunk 66861ad3340a with the marked LinearMath changes): the game's
# compiler at -O3, without merged constants, NDEBUG (notes/COMPILER.md)
[compiler.dirs."src/bullet"]
linux = "~/lbp-gcc4/psp-gcc-4.0.4a/bin/psp-gcc"
flags = "-O3 -G0 -mpreferred-stack-boundary=4 -fno-merge-constants -DNDEBUG -nostdinc -Iinclude/cxx -Iinclude/libc -Isrc/bullet"

# tools/common/try_unit.py: the code not split into units is all in text.s
[try]
compile = "{cc} -c {flags} -Iinclude -Isrc -o {obj} {src}"
target = "build/{version}/asm/{version}/eboot/{piece}.s.o"

# Code regions of the progress card (tools/common/progress_badges.py), grouped from
# the region map of notes/SPLITS.md (bounds approximate, library names from strings
# of the binary)
[regions.UCES01241]
"Start-up" = [[0x30, 0x51C]]
"Game" = [[0x51C, 0x133CCC]]
"C++ demangler" = [[0x133CCC, 0x139438]]
"Unidentified" = [[0x139438, 0x13A2C0]]
"Bullet Physics" = [[0x13A2C0, 0x17864C]]
"expat 2.0.0" = [[0x17864C, 0x18DE70]]
"SDK and runtime libraries" = [[0x18DE70, 0x1BA6D0]]
"Inline functions and templates" = [[0x1BA6D0, 0x1E3294]]

[progress]
region_note = "region bounds are approximate (notes/SPLITS.md)"

# tools/common/report_diff.py: units that hold the code not yet in a source file
[report]
auto_units = ["asm/"]

# tools/common/check_traces.py: the README's disclosure line
[traces]
allow = ["decompile this for me"]
