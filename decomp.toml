# Project settings read by the tools of tools/psp and tools/common

title = "Invizimals"

# First one is the default version
versions = [
    "UCES01241",  # Europe (13 languages), DISC_VERSION 1.00
    "UCUS98746",  # USA, DISC_VERSION 1.02 (paused: all-assembly build only)
]

binutils_prefix = "mips-ps2-decompals-"

# PSP_GAME/SYSDIR/EBOOT.BIN decrypted by tools/extract.py (BOOT.BIN is zeroed on
# this disc): a relocatable PRX (SPEC.md)
[modules.eboot]
file = "EBOOT.PRX"
splat = "splat.eboot.yaml"
relocatable = true

# GCC 4.0.4 built from GNU sources with the Allegrex patch and tuning of the
# LBP-PSP-Decomp kit (build 4.0.4c): 12/12 on the probes at -O2 -G0
# (notes/COMPILER.md). A Linux program, run through WSL on Windows.
[compiler]
name = "psp-gcc-4.0.4c"
linux = "~/lbp-gcc4/psp-gcc-4.0.4c/bin/psp-gcc"
flags = "-O2 -G0"

# tools/common/try_unit.py: the code not split into units is all in text.s
[try]
compile = "{cc} -c {flags} -Iinclude -Isrc -o {obj} {src}"
target = "build/{version}/asm/{version}/eboot/{piece}.s.o"

# tools/common/report_diff.py: units that hold the code not yet in a source file
[report]
auto_units = ["asm/"]

# tools/common/check_traces.py: the README's disclosure line
[traces]
allow = ["decompile this for me"]
